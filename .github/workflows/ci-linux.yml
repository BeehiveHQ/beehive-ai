name: CI Linux

on:
  push:
    branches:
      - main
    paths:
      - 'beehive/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'setup.cfg'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'beehive/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'setup.cfg'
      - 'Makefile'
      - '.github/workflows/**'

env:
  OPENAI_API_KEY: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.20"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Tests
      run: uv run --locked pytest beehive/tests tests -v
